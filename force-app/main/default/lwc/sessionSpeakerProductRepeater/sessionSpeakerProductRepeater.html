<template>
    <div class="slds-p-around_medium">
        <template for:each={entries} for:item="entry" for:index="index">
            <div key={entry.key} class="slds-box slds-m-bottom_small slds-theme_default">
                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Speakers (multi-select + pills) -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <template if:true={allSpeakers}>
                                    <c-multi-select-search-list
                                        label="Speakers"
                                        options={allSpeakers}
                                        value={entry.speakerIds}
                                        data-index={index}
                                        data-field="Speakers"
                                        onchange={handleMultiSelection}>
                                    </c-multi-select-search-list>
                                </template>
                            </div>

                            <div class="slds-m-top_x-small" style="max-height: 3rem;">
                                <lightning-pill-container
                                    items={entry.speakerPills}
                                    onitemremove={handleMultiItemRemove}
                                    is-collapsible="true"
                                    is-expanded="false"
                                    data-index={index}
                                    data-field="Speakers">
                                </lightning-pill-container>
                            </div>
                        </div>
                    </div>

                    <!-- Products (multi-select + pills) -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <template if:true={allProducts}>
                                    <c-multi-select-search-list
                                        label="Products"
                                        options={allProducts}
                                        value={entry.productIds}
                                        data-index={index}
                                        data-field="Products"
                                        onchange={handleMultiSelection}>
                                    </c-multi-select-search-list>
                                </template>
                            </div>

                            <div class="slds-m-top_x-small" style="max-height: 3rem;">
                                <lightning-pill-container
                                    items={entry.productPills}
                                    onitemremove={handleMultiItemRemove}
                                    is-collapsible="true"
                                    is-expanded="false"
                                    data-index={index}
                                    data-field="Products">
                                </lightning-pill-container>
                            </div>
                        </div>
                    </div>

                    <!-- Language__c -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <template if:true={hasLanguagePicklist}>
                                    <lightning-combobox
                                        label="Language"
                                        placeholder="Select language"
                                        options={languageOptions}
                                        value={entry.language}
                                        onchange={handleLanguageChange}
                                        data-index={index}>
                                    </lightning-combobox>
                                </template>
                                <template if:false={hasLanguagePicklist}>
                                    <lightning-input
                                        type="text"
                                        label="Language"
                                        placeholder="Enter language"
                                        value={entry.language}
                                        onchange={handleLanguageChange}
                                        data-index={index}>
                                    </lightning-input>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="slds-m-top_small slds-grid slds-grid_align-end">
                    <lightning-button-icon
                        icon-name="utility:delete"
                        variant="bare"
                        alternative-text="Remove"
                        title="Remove this speaker/product block"
                        onclick={removeEntry}
                        data-index={index}>
                    </lightning-button-icon>
                </div>
            </div>
        </template>

        <div class="slds-m-top_small slds-grid slds-grid_align-spread">
            <lightning-button
                icon-name="utility:add"
                label="Add Speaker/Product Block"
                onclick={addEntry}>
            </lightning-button>

            <!-- Visible uniquement si debug -->
            <template if:true={debugEnabled}>
                <lightning-button
                    variant="brand"
                    label="Rebuild Output (debug)"
                    onclick={handleRebuildClick}>
                </lightning-button>
            </template>
        </div>

        <template if:true={debugEnabled}>
            <div class="slds-m-top_medium slds-box slds-theme_alert-texture">
                <h3 class="slds-text-title_bold slds-m-bottom_x-small">
                    Debug: Records JSON (outputValue)
                </h3>
                <pre style="white-space: pre-wrap">{outputValue}</pre>
            </div>
        </template>
    </div>
</template>
