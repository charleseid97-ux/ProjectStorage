<template>
  <lightning-card title="Follow Up Tasks">
    <div class="slds-p-around_medium">
      <!-- Add Task -->
      <div class="slds-text-align_right slds-m-bottom_small">
        <lightning-button-icon
          icon-name="utility:add"
          variant="brand"
          alternative-text="New Task"
          title="New Task"
          onclick={handleAddTask}>
        </lightning-button-icon>
      </div>

      <template for:each={allTasks} for:item="task">
        <div key={task.Index} class="slds-m-bottom_medium slds-box slds-theme_default">

          <div class="slds-grid slds-gutters">
            <!-- Description -->
            <div class="slds-col slds-size_3-of-6 slds-var-p-right_x-small">
              <lightning-textarea
                label="Description"
                maxlength="255"
                value={task.Description__c}
                data-id={task.Index}
                onchange={handleDescriptionChange}>
              </lightning-textarea>
            </div>

            <!-- Due Date -->
            <div class="slds-col slds-size_1-of-6 slds-var-p-right_x-small">
              <lightning-input
                type="date"
                label="Due Date"
                value={task.ActivityDate}
                data-id={task.Index}
                onchange={handleDateChange}>
              </lightning-input>
            </div>

            <!-- Assigned To -->
            <div class="slds-col slds-size_2-of-6">
              <template if:true={allUsers}>
                <template if:true={task.OwnerId}>
                  <label class="slds-form-element__label">Assigned To</label>
                  <div class="slds-pill-container slds-border_right slds-border_top slds-border_bottom slds-border_left slds-var-p-top_xxx-small"
                       style="border-radius: 0.25rem;min-height: 2rem;">
                    <lightning-pill
                      data-id={task.Index}
                      label={task.OwnerLabel}
                      onremove={handleRemoveSelectedUser}>
                    </lightning-pill>
                  </div>
                </template>

                <template if:false={task.OwnerId}>
                  <c-multi-select-search-list
                    label="Assigned To"
                    mono-select="true"
                    options={allUsers}
                    value={task.OwnerId}
                    data-id={task.Index}
                    onchange={handleUsers}>
                  </c-multi-select-search-list>
                </template>
              </template>
            </div>
          </div>

          <!-- Delete only on last row (same behavior) -->
          <template if:true={task.IsDelete}>
            <div class="slds-align_absolute-center slds-var-p-top_small">
              <lightning-button
                variant="destructive"
                label="Delete Task"
                title="Delete"
                icon-name="utility:delete"
                data-id={task.Index}
                onclick={handleDeleteTask}>
              </lightning-button>
            </div>
          </template>

        </div>
      </template>

      <!-- Save -->
      <div class="slds-m-top_medium slds-text-align_right">
        <lightning-button
          variant="brand"
          label="Save Tasks"
          onclick={handleSaveTasks}
          disabled={isSaving}>
        </lightning-button>
      </div>

    </div>
  </lightning-card>
</template>
