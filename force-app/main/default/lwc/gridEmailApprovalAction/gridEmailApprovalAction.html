<template>
    <div class="action-wrapper">

        <!-- ── Loading ── -->
        <template if:true={isLoading}>
            <div class="center-container">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- ── Not eligible / catch-all ── -->
        <template if:true={showNotEligible}>
            <lightning-card>
                <div class="center-container slds-p-around_large">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="large"></lightning-icon>
                    <p class="slds-m-top_medium slds-text-align_center ineligible-msg">{label.notEligible}</p>
                    <lightning-button label="Go to Grid"
                                      variant="neutral"
                                      class="slds-m-top_medium"
                                      onclick={handleCancel}>
                    </lightning-button>
                </div>
            </lightning-card>
        </template>

        <!-- ── Success ── -->
        <template if:true={isDone}>
            <lightning-card>
                <div class="center-container slds-p-around_large">
                    <lightning-icon icon-name="utility:success" variant="success" size="large"></lightning-icon>
                    <p class="slds-m-top_medium slds-text-align_center slds-text-heading_small">{successMessage}</p>
                    <p class="slds-m-top_small slds-text-align_center slds-text-color_weak">Redirecting you to the Grid record…</p>
                </div>
            </lightning-card>
        </template>

        <!-- ── Confirmation ── -->
        <template if:true={showConfirm}>
            <lightning-card title={cardTitle} icon-name={cardIcon}>
                <div class="slds-p-around_medium">

                    <!-- Grid info box -->
                    <div class="info-box slds-m-bottom_medium">
                        <p class="slds-text-body_small slds-text-color_weak">Grid</p>
                        <p class="slds-text-heading_small slds-m-top_xx-small">{gridName}</p>
                    </div>

                    <!-- Action badge -->
                    <div class="slds-m-bottom_medium">
                        <span class={actionBadgeClass}>{actionLabel}</span>
                    </div>

                    <!-- Comment -->
                    <lightning-textarea label="Comments (optional)"
                                        placeholder="Enter your comments…"
                                        value={comments}
                                        max-length="1000"
                                        onchange={handleCommentChange}>
                    </lightning-textarea>

                    <!-- Buttons -->
                    <div class="slds-m-top_medium button-row">
                        <lightning-button label={confirmLabel}
                                          variant={confirmVariant}
                                          disabled={isProcessing}
                                          onclick={handleConfirm}>
                        </lightning-button>
                        <lightning-button label="Cancel"
                                          variant="neutral"
                                          class="slds-m-left_small"
                                          disabled={isProcessing}
                                          onclick={handleCancel}>
                        </lightning-button>
                    </div>

                    <!-- Processing spinner -->
                    <template if:true={isProcessing}>
                        <div class="slds-m-top_medium">
                            <lightning-spinner size="small" alternative-text="Processing"></lightning-spinner>
                        </div>
                    </template>

                </div>
            </lightning-card>
        </template>

    </div>
</template>
