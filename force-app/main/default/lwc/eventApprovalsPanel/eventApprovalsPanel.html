<template>
    <lightning-card title="Approvals" icon-name="standard:approval">
        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
            </template>

            <!-- ===================== -->
            <!-- PENDING SECTION       -->
            <!-- ===================== -->
            <div class="slds-m-bottom_medium">
                <div class="slds-text-heading_small slds-m-bottom_x-small">
                    Pending
                </div>

                <template if:true={hasPending}>
                    <template for:each={pendingWithTitle} for:item="row">
                        <div key={row.workItemId} class="slds-box slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start item-row">

                                <!-- Left -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                                    <div class="slds-text-heading_medium">
                                        {row.displayTitle}
                                    </div>

                                    <div class="slds-text-body_small">
                                        Process: {row.processName}
                                    </div>

                                    <div class="slds-text-body_small">
                                        Assigned to: {row.assignedApproverName}
                                    </div>
                                </div>

                                <!-- Right -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 right-column">
                                    <template if:true={row.canAct}>

                                        <template if:false={row.showRejectBox}>
                                            <div class="slds-m-top_small">
                                                <lightning-button
                                                    label="Approve"
                                                    variant="brand"
                                                    data-workitem-id={row.workItemId}
                                                    onclick={handleApprove}>
                                                </lightning-button>

                                                <lightning-button
                                                    label="Reject"
                                                    variant="destructive"
                                                    class="slds-m-left_small"
                                                    data-workitem-id={row.workItemId}
                                                    onclick={handleOpenReject}>
                                                </lightning-button>
                                            </div>
                                        </template>

                                        <template if:true={row.showRejectBox}>
                                            <div class="slds-m-top_small">
                                                <lightning-textarea
                                                    label="Rejection comment"
                                                    data-workitem-id={row.workItemId}
                                                    value={row.rejectComment}
                                                    onchange={handleRejectCommentChange}>
                                                </lightning-textarea>

                                                <div class="slds-m-top_medium">
                                                    <lightning-button
                                                        label="Reject"
                                                        variant="destructive"
                                                        data-workitem-id={row.workItemId}
                                                        onclick={handleSubmitReject}>
                                                    </lightning-button>

                                                    <lightning-button
                                                        label="Cancel"
                                                        variant="neutral"
                                                        class="slds-m-left_medium"
                                                        data-workitem-id={row.workItemId}
                                                        onclick={handleCancelReject}>
                                                    </lightning-button>
                                                </div>
                                            </div>
                                        </template>

                                    </template>
                                </div>

                            </div>
                        </div>
                    </template>
                </template>

                <template if:false={hasPending}>
                    <div>No pending approvals.</div>
                </template>
            </div>

            <!-- ===================== -->
            <!-- PROCESSED SECTION     -->
            <!-- ===================== -->
            <div>
                <div class="slds-text-heading_small slds-m-bottom_x-small">
                    Processed
                </div>

                <template if:true={hasProcessed}>
                    <template for:each={processedWithTitle} for:item="prow">
                        <div key={prow.processInstanceId} class="slds-box slds-m-bottom_small">

                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start item-row">

                                <!-- LEFT COLUMN -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">

                                    <div class="slds-text-heading_medium">
                                        {prow.displayTitle}
                                    </div>

                                    <div class="slds-text-body_small slds-grid slds-grid_vertical-align-center slds-m-top_x-small slds-m-bottom_x-small">
                                        <template if:true={prow.resultIcon}>
                                            <lightning-icon
                                                icon-name={prow.resultIcon}
                                                variant={prow.resultVariant}
                                                class={prow.resultClass}
                                                size="x-small"
                                                alternative-text={prow.result}
                                                title={prow.result}>
                                            </lightning-icon>
                                        </template>

                                        <span class={prow.resultTextClass}>
                                            {prow.result}
                                        </span>
                                    </div>

                                    <div class="slds-text-body_small">
                                        Process: {prow.processName}
                                    </div>

                                    <template if:true={prow.showProcessedComment}>
                                        <div class="slds-text-body_small slds-m-top_x-small">
                                            <strong>Comment:</strong> {prow.comments}
                                        </div>
                                    </template>

                                </div>

                                <!-- RIGHT COLUMN -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 right-column">

                                    <div class="review-section">

                                        <div class="slds-text-body_small slds-text-title_caps slds-text-color_weak">
                                            Reviewed by
                                        </div>

                                        <div class="slds-text-body_small slds-m-top_x-small">
                                            {prow.actorNameTrimmed}
                                        </div>

                                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                            {prow.actionDateFormatted}
                                        </div>

                                        <template if:true={prow.isRecalled}>
                                            <div class="slds-m-top_small">
                                                <lightning-button
                                                    label="Recalled"
                                                    variant="neutral"
                                                    disabled>
                                                </lightning-button>
                                            </div>
                                        </template>

                                        <template if:false={prow.isRecalled}>
                                            <template if:true={prow.showRecalledDisabled}>
                                                <div class="slds-m-top_small">
                                                    <lightning-button
                                                        label="Recalled"
                                                        variant="neutral"
                                                        disabled>
                                                    </lightning-button>
                                                </div>
                                            </template>

                                            <template if:false={prow.showRecalledDisabled}>
                                                <template if:true={prow.canRecall}>
                                                    <div class="slds-m-top_small">
                                                        <template if:false={prow.showRecallBox}>
                                                            <lightning-button
                                                                label="Recall approval"
                                                                variant="neutral"
                                                                data-process-instance-id={prow.processInstanceId}
                                                                onclick={handleOpenRecall}>
                                                            </lightning-button>
                                                        </template>
                                                    </div>
                                                </template>
                                            </template>
                                        </template>

                                    </div>

                                    <template if:true={prow.showRecallBox}>
                                        <div class="slds-m-top_small">

                                            <lightning-textarea
                                                label="Comment"
                                                data-process-instance-id={prow.processInstanceId}
                                                value={prow.recallComment}
                                                onchange={handleRecallCommentChange}>
                                            </lightning-textarea>

                                            <div class="slds-m-top_medium">
                                                <lightning-button
                                                    label="Submit"
                                                    variant="brand"
                                                    data-process-instance-id={prow.processInstanceId}
                                                    onclick={handleSubmitRecall}>
                                                </lightning-button>

                                                <lightning-button
                                                    label="Cancel"
                                                    variant="neutral"
                                                    class="slds-m-left_medium"
                                                    data-process-instance-id={prow.processInstanceId}
                                                    onclick={handleCancelRecall}>
                                                </lightning-button>
                                            </div>

                                        </div>
                                    </template>

                                </div>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:false={hasProcessed}>
                    <div>No processed approvals.</div>
                </template>
            </div>

        </div>
    </lightning-card>
</template>
