<template>
    <lightning-card title="Speakers & Products">

        <div class="slds-p-around_medium">

            <template if:true={loading}>
                <lightning-spinner
                    alternative-text="Loading"
                    size="small">
                </lightning-spinner>
            </template>

            <template if:false={hasEventId}>
                <div class="slds-text-color_weak">
                    No Event linked to this Campaign.
                </div>
            </template>

            <template if:true={hasData}>
                <!-- Modern speakers/products table -->
                <div class="slds-box slds-theme_default table-container">

                    <!-- Header -->
                    <div class="slds-grid table-header slds-p-around_small">
                        <div class="slds-col slds-size_4-of-12">
                            Speaker
                        </div>

                        <div class="slds-col slds-size_8-of-12">
                            Products
                        </div>
                    </div>

                    <!-- Rows -->
                    <template for:each={groups} for:item="g">
                        <div
                            key={g.speakerId}
                            class="slds-grid speaker-row slds-p-around_medium slds-m-top_small">

                            <!-- Speaker -->
                            <div class="slds-col slds-size_4-of-12">

                                <div class="slds-grid slds-grid_vertical-align-center">

                                    <div class="speaker-avatar">
                                        <lightning-icon
                                            icon-name="standard:user"
                                            size="small">
                                        </lightning-icon>
                                    </div>

                                    <div class="slds-m-left_small speaker-name">
                                        {g.speakerName}
                                    </div>

                                </div>

                            </div>

                            <!-- Products -->
                            <div class="slds-col slds-size_8-of-12">

                                <div class="products-container">

                                    <template for:each={g.products} for:item="p">
                                        <span
                                            key={p.linkId}
                                            class="product-pill">

                                            {p.productName}

                                        </span>
                                    </template>

                                </div>

                            </div>

                        </div>
                    </template>

                </div>
            </template>

            <template if:true={empty}>
                <div class="slds-text-color_weak">
                    No speakers/products found for this event.
                </div>
            </template>

        </div>

    </lightning-card>
</template>
