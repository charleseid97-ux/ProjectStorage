<template>

    <lightning-card title="Approval Inbox" icon-name="standard:approval">

        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner size="medium"></lightning-spinner>
            </template>

            <div class="filters">

                <lightning-input
                    type="checkbox"
                    label="Assigned to me"
                    name="showAssignedToMe"
                    checked={showAssignedToMe}
                    onchange={handleFilterChange}>
                </lightning-input>

                <lightning-input
                    type="checkbox"
                    label="Assigned to queue"
                    name="showAssignedToQueue"
                    checked={showAssignedToQueue}
                    onchange={handleFilterChange}>
                </lightning-input>

                <template if:true={showOtherFilter}>
                    <lightning-input
                        type="checkbox"
                        label="Other Assistant Approvals"
                        name="showAssignedToOther"
                        checked={showAssignedToOther}
                        onchange={handleFilterChange}>
                    </lightning-input>
                </template>

                <template if:true={showOrganizerApprovalFilter}>
                    <lightning-input
                        type="checkbox"
                        label="Organizer approvals"
                        name="showOrganizerApprovals"
                        checked={showOrganizerApprovals}
                        onchange={handleFilterChange}>
                    </lightning-input>
                </template>

                <template if:true={showHopApprovalFilter}>
                    <lightning-input
                        type="checkbox"
                        label="Head of Product approvals"
                        name="showHopApprovals"
                        checked={showHopApprovals}
                        onchange={handleFilterChange}>
                    </lightning-input>
                </template>

                <lightning-button
                    label="Approve selected"
                    variant="brand"
                    onclick={handleApproveSelected}>
                </lightning-button>

            </div>

            <lightning-tabset>

                <lightning-tab
                    if:true={showEventApprovalTable}
                    label={eventTabLabel}
                    value="events">

                    <lightning-datatable
                        onsort={handleSort}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        key-field="workItemId"
                        data={filteredEventRows}
                        columns={eventColumns}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                </lightning-tab>

                <lightning-tab
                    if:true={showSpeakerApprovalTable}
                    label={speakerTabLabel}
                    value="speakers">

                    <lightning-datatable
                        onsort={handleSort}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        key-field="workItemId"
                        data={filteredSpeakerRows}
                        columns={speakerColumns}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                </lightning-tab>

                <lightning-tab
                    if:true={showOrganizerApprovalTable}
                    label={organizerTabLabel}
                    value="organizers">

                    <lightning-datatable
                        onsort={handleSort}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        key-field="workItemId"
                        data={filteredOrganizerRows}
                        columns={organizerColumns}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                </lightning-tab>
                
                <lightning-tab
                    if:true={showHopApprovalTable}
                    label={hopTabLabel}
                    value="hop">

                    <lightning-datatable
                        onsort={handleSort}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        key-field="workItemId"
                        data={filteredHopRows}
                        columns={hopColumns}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                </lightning-tab>

            </lightning-tabset>

        </div>

    </lightning-card>

</template>
