<template>
    <template if:true={hasEventId}>
        <lightning-card>
        <!-- Custom header -->
        <div class="slds-p-horizontal_small slds-p-top_small slds-grid slds-grid_vertical-align-center">
            <h2 class="slds-text-heading_small">
                Speakers & Products
            </h2>

            <lightning-button
                class="slds-m-left_small"
                label="Edit"
                icon-name="utility:edit"
                variant="neutral"
                onclick={openEdit}>
            </lightning-button>

            <lightning-button-icon
                class="slds-m-left_x-small"
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={refresh}
                variant="bare">
            </lightning-button-icon>
        </div>

        <!-- Card body -->
            <div class="slds-p-around_medium">

                <template if:true={loading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>

                <template if:true={hasData}>
                    <template for:each={groups} for:item="g">
                        <article key={g.speakerId} class="slds-card slds-m-bottom_small slds-p-around_small slds-theme_default">
                            <div class="slds-grid slds-wrap slds-gutters slds-var-m-bottom_x-small">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                                    <div class="slds-text-heading_small slds-truncate" title={g.speakerName}>
                                        <lightning-icon icon-name="standard:user" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        {g.speakerName}
                                    </div>
                                </div>
                            </div>

                            <div class="slds-var-m-top_x-small slds-wrap">
                                <template for:each={g.products} for:item="p">
                                    <span key={p.linkId} class="slds-m-right_x-small slds-m-bottom_x-small slds-inline-block">
                                        <lightning-pill label={p.productName}>
                                            <lightning-icon icon-name="standard:product" size="x-small"></lightning-icon>
                                        </lightning-pill>
                                    </span>
                                </template>
                            </div>
                        </article>
                    </template>
                </template>

                <template if:true={empty}>
                    <div class="slds-text-color_weak">
                        No speakers/products found for this event.
                    </div>
                </template>

                <template if:true={error}>
                    <c-inline-error message={errorMessage}></c-inline-error>
                </template>

                <template if:true={impactedCount}>
                    <div class="slds-m-top_small slds-text-color_success">
                        Updated {impactedCount} record(s).
                    </div>
                </template>
            </div>
        </lightning-card>

        <!-- Global Edit Modal -->
        <template if:true={isEditOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Edit"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container slds-modal__container_large">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={closeEdit}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Edit Speaker / Product links</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <c-session-speaker-product-repeater
                            parent-event-id={effectiveEventId}
                            debug="false"
                            input-value={initialJson}
                            onjsonchange={handleRepeaterJsonChange}>
                        </c-session-speaker-product-repeater>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeEdit}></lightning-button>
                        <lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={saveEdit}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </template>

    <template if:false={hasEventId}>
        <lightning-card>
            <div class="slds-p-horizontal_small slds-p-top_small slds-grid slds-grid_vertical-align-center">
                <h2 class="slds-text-heading_small">Speakers & Products</h2>
                <lightning-button class="slds-m-left_small" label="Edit" icon-name="utility:edit" variant="neutral" onclick={openEdit} disabled></lightning-button>
                <lightning-button-icon class="slds-m-left_x-small" icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={refresh} variant="bare" disabled></lightning-button-icon>
            </div>
            <div class="slds-p-around_medium slds-text-color_weak">
                Provide an Event Id to view related speakers and products.
            </div>
        </lightning-card>
    </template>
</template>
