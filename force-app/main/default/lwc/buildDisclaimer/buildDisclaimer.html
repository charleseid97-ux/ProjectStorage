<template>
    <lightning-card>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <div class="main-div">
            <div class="builder-header">
                <button class="nav-btn nav-btn-back" onclick={handleBack} disabled={isBackDisabled}>
                    <span class="nav-btn-arrow nav-btn-back-arrow">←</span> Back
                </button>
                <div class="builder-path">
                    <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
                        <lightning-progress-step label="General Settings" value="1" data-step="1" onclick={handlePathStepClick} class={generalStepClass}></lightning-progress-step>
                        <lightning-progress-step label="Disclaimer Content" value="2" data-step="2" onclick={handlePathStepClick} class={contentStepClass}></lightning-progress-step>
                    </lightning-progress-indicator>
                </div>
                <button class="nav-btn nav-btn-next" onclick={handleNext} disabled={isNextDisabled}>
                    Next <span class="nav-btn-arrow nav-btn-next-arrow">→</span>
                </button>
            </div>

            <template if:true={isGeneralStep}>
                <div class="general-settings">
                    <div class="filter-box">
                        <c-multi-select-search-list
                            label="Country"
                            options={countryOptions}
                            value={selectedCountry}
                            mono-select="true"
                            required-label="true"
                            show-values-when-not-selecting="true"
                            data-field="selectedCountry"
                            onchange={handleSettingChange}>
                        </c-multi-select-search-list>
                    </div>

                    <div class="filter-box">
                        <c-multi-select-search-list
                            label="Language"
                            options={languageOptions}
                            value={selectedLanguage}
                            mono-select="true"
                            required-label="true"
                            show-values-when-not-selecting="true"
                            data-field="selectedLanguage"
                            onchange={handleSettingChange}>
                        </c-multi-select-search-list>
                    </div>

                    <div class="filter-box">
                        <c-multi-select-search-list
                            label="Media"
                            options={mediaOptions}
                            value={selectedMedia}
                            enable-select-all="true"
                            show-values-when-not-selecting="true"
                            data-field="selectedMedia"
                            onchange={handleSettingChange}>
                        </c-multi-select-search-list>
                    </div>

                    <div class="filter-box">
                        <lightning-input
                            type="checkbox"
                            label="Choose products"
                            checked={includeProducts}
                            field-level-help="Tick to select, in the next step, the products the disclaimer applies to."
                            onchange={handleIncludeProductsChange}>
                        </lightning-input>
                    </div>
                </div>
            </template>

            <template if:true={isContentStep}>
                <div class="content-step">
                    <div class="slds-tabs_default">
                        <ul class="slds-tabs_default__nav" role="tablist">
                            <template for:each={footnoteTabs} for:item="tab">
                                <li key={tab.id} class={tab.className} role="presentation">
                                    <a href="#" class="slds-tabs_default__link" role="tab" aria-selected={tab.isActive} data-id={tab.id} onclick={handleTabSelect}>{tab.label}</a>
                                </li>
                            </template>
                            <li class="slds-tabs_default__item add-tab" role="presentation">
                                <a href="#" class="slds-tabs_default__link" role="tab" title="Add a footnote" onclick={handleAddFootnote}>
                                    <lightning-icon icon-name="utility:add" size="xx-small" alternative-text="Add a footnote"></lightning-icon>
                                </a>
                            </li>
                            <template for:each={endDisclaimerTabs} for:item="tab">
                                <li key={tab.id} class={tab.className} role="presentation">
                                    <a href="#" class="slds-tabs_default__link" role="tab" aria-selected={tab.isActive} data-id={tab.id} onclick={handleTabSelect}>{tab.label}</a>
                                </li>
                            </template>
                        </ul>
                    </div>

                    <div class="filters-header">
                        <button class="slds-button filters-toggle" aria-expanded={filtersExpanded} onclick={toggleFilters}>
                            <lightning-icon icon-name={filtersIcon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span class="slds-text-heading_small">Filters</span>
                        </button>
                        <template if:false={filtersExpanded}>
                            <div class="filter-summary">
                                <template for:each={filterSummary} for:item="pill">
                                    <span key={pill.key} class="slds-badge">{pill.label}</span>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class={filtersBodyClass}>
                        <div class="filters-grid">
                            <template if:true={includeProducts}>
                                <div class="filter-box">
                                    <lightning-dual-listbox
                                        label="Products"
                                        source-label="Available"
                                        selected-label="Selected"
                                        options={productOptions}
                                        value={selectedProducts}
                                        size="4"
                                        required
                                        onchange={handleProductsChange}>
                                    </lightning-dual-listbox>
                                </div>
                            </template>

                            <template for:each={typeSections} for:item="section">
                                <div key={section.typeName} class="filter-box">
                                    <lightning-dual-listbox
                                        label={section.label}
                                        source-label="Available"
                                        selected-label="Selected"
                                        options={section.options}
                                        value={section.selected}
                                        size="4"
                                        data-type={section.typeName}
                                        onchange={handleTypeChange}>
                                    </lightning-dual-listbox>
                                </div>
                            </template>
                        </div>

                        <template if:true={hasNoTypeSection}>
                            <p class="slds-text-color_weak slds-m-top_small">{noTypeSectionMessage}</p>
                        </template>

                        <div class="slds-m-top_medium">
                            <lightning-button
                                label="Search"
                                variant="brand"
                                disabled={isSearchDisabled}
                                onclick={handleSearch}>
                            </lightning-button>
                        </div>
                    </div>

                    <template if:true={hasSearched}>
                        <div class="result-div">
                            <div class="slds-box slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">{previewTitle}</h3>
                                <lightning-textarea
                                    label={previewTitle}
                                    variant="label-hidden"
                                    value={previewContent}
                                    disabled="true">
                                </lightning-textarea>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <div slot="footer" class="slds-align_absolute-center">
            <lightning-button
                label="Cancel"
                variant="neutral"
                onclick={handleCancel}>
            </lightning-button>
            <template if:true={isContentStep}>
                <lightning-button
                    label="Build Disclaimer"
                    variant="brand"
                    class="slds-m-left_small"
                    disabled={isBuildDisabled}
                    onclick={handleBuild}>
                </lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
