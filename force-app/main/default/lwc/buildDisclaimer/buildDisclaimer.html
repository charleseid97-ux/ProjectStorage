<template>
    <lightning-card>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <div class="main-div">
            <div class="filters-header">
                <button class="slds-button filters-toggle" aria-expanded={filtersExpanded} onclick={toggleFilters}>
                    <lightning-icon icon-name={filtersIcon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-text-heading_small">Filters</span>
                </button>
                <template if:false={filtersExpanded}>
                    <div class="filter-summary">
                        <template for:each={filterSummary} for:item="pill">
                            <span key={pill.key} class="slds-badge">{pill.label}</span>
                        </template>
                    </div>
                </template>
            </div>

            <div class={filtersBodyClass}>
                <div class="filters-grid">
                    <div class="filter-box">
                        <lightning-combobox
                            label="Country"
                            options={countryOptions}
                            value={selectedCountry}
                            data-field="selectedCountry"
                            onchange={handleValueChange}>
                        </lightning-combobox>
                    </div>

                    <div class="filter-box">
                        <lightning-combobox
                            label="Language"
                            options={languageOptions}
                            value={selectedLanguage}
                            data-field="selectedLanguage"
                            onchange={handleValueChange}>
                        </lightning-combobox>
                    </div>

                    <div class="filter-box">
                        <c-multi-select-search-list
                            label="Media"
                            options={mediaOptions}
                            value={selectedMedia}
                            enable-select-all="true"
                            show-values-when-not-selecting="true"
                            onchange={handleMediaChange}>
                        </c-multi-select-search-list>
                    </div>

                    <div class="filter-box">
                        <lightning-dual-listbox
                            label="Products"
                            source-label="Available"
                            selected-label="Selected"
                            options={productOptions}
                            value={selectedProducts}
                            size="4"
                            data-field="selectedProducts"
                            onchange={handleValueChange}>
                        </lightning-dual-listbox>
                    </div>

                    <template for:each={typeSections} for:item="section">
                        <div key={section.type} class="filter-box">
                            <lightning-dual-listbox
                                label={section.label}
                                source-label="Available"
                                selected-label="Selected"
                                options={section.options}
                                value={section.selected}
                                size="4"
                                data-type={section.type}
                                onchange={handleTypeChange}>
                            </lightning-dual-listbox>
                        </div>
                    </template>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Search"
                        variant="brand"
                        disabled={isSearchDisabled}
                        onclick={handleSearch}>
                    </lightning-button>
                </div>
            </div>

            <template if:true={hasSearched}>
                <div class="result-div">
                    <div class="slds-box slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            Footnote ({footnoteCount} matching narrative(s))
                        </h3>
                        <lightning-textarea
                            label="Footnote content"
                            variant="label-hidden"
                            value={footnoteContent}
                            disabled="true">
                        </lightning-textarea>
                    </div>
                    <div class="slds-box slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            End Disclaimer ({endDisclaimerCount} matching narrative(s))
                        </h3>
                        <lightning-textarea
                            label="End Disclaimer content"
                            variant="label-hidden"
                            value={endDisclaimerContent}
                            disabled="true">
                        </lightning-textarea>
                    </div>
                </div>
            </template>
        </div>

        <div slot="footer" class="slds-align_absolute-center">
            <lightning-button
                label="Cancel"
                variant="neutral"
                class="slds-m-right_small"
                onclick={handleCancel}>
            </lightning-button>
            <lightning-button
                label="Build Disclaimer"
                variant="brand"
                disabled={isBuildDisabled}
                onclick={handleBuild}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
