trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

schedules:
  - cron: '0 23 * * *'
    displayName: 'nightly'
    branches:
      include:
        - uat
        - release
    always: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  TEST_LEVEL_PROD: 'RunLocalTests'

  workingDirectory: '$(Build.SourcesDirectory)'
  SONAR_ORG: 'sonarcloudtools'
  SONAR_PROJECT_KEY: 'DBS.SalesForce'
  SONAR_PROJECT_NAME: 'DBS.SalesForce'

  MANIFEST_PATH: 'manifest/package.xml'
  SFDX_ROOT: 'force-app/main/default'

stages:
- stage: SONAR
  displayName: 'SonarCloud + Gate (BLOCKER/CRITICAL)'
  jobs:
  - job: Sonar
    displayName: 'Sonar analysis + blocking gate'
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y jq xmlstarlet curl
      displayName: 'Install jq + xmlstarlet + curl'

    - bash: |
        set -euo pipefail

        HTTP_CODE=$(curl -sS \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 2 \
          --retry-all-errors \
          -o /tmp/sonar-version.txt \
          -w "%{http_code}" \
          "https://sonarcloud.io/api/server/version" || true)

        if [[ "$HTTP_CODE" == "200" ]]; then
          echo "SonarCloud disponible."
          echo "##vso[task.setvariable variable=SONAR_AVAILABLE]true"
        else
          echo "##vso[task.logissue type=warning]SonarCloud indisponible (HTTP $HTTP_CODE). Analyse ignoree, deploiement autorise."
          echo "##vso[task.setvariable variable=SONAR_AVAILABLE]false"
        fi
      displayName: 'Check SonarCloud availability'

    - bash: |
        set -euo pipefail
        set -x

        MANIFEST="$(MANIFEST_PATH)"
        ROOT="$(SFDX_ROOT)"

        [[ -f "$MANIFEST" ]] || { echo "ERREUR: $MANIFEST introuvable"; exit 21; }

        lower () { echo "$1" | tr '[:upper:]' '[:lower:]'; }

        members_of () {
          local t_lc
          t_lc="$(lower "$1")"
          xmlstarlet sel -t \
            -m "//*[local-name()='types'][translate(./*[local-name()='name'],'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz')='${t_lc}']/*[local-name()='members']" \
            -v "normalize-space(.)" -n "$MANIFEST" 2>/dev/null | sed '/^$/d' || true
        }

        rm -f sonar-inclusions.txt
        touch sonar-inclusions.txt

        add_incl () { echo "$1" >> sonar-inclusions.txt; }

        add_folder_or_specific () {
          local members="$1"
          local folder="$2"
          local suffix="${3:-}"
          local has_all=0

          while IFS= read -r m; do
            [[ -z "$m" ]] && continue
            if [[ "$m" == "*" ]]; then
              has_all=1
            else
              if [[ -n "$suffix" ]]; then
                add_incl "$folder/$m$suffix"
              else
                add_incl "$folder/$m/**"
              fi
            fi
          done <<< "$members"

          if [[ $has_all -eq 1 ]]; then
            if [[ -n "$suffix" ]]; then
              add_incl "$folder/**$suffix"
            else
              add_incl "$folder/**"
            fi
          fi
        }

        APEX_CLASSES="$(members_of ApexClass)"
        if [[ -n "$APEX_CLASSES" ]]; then
          add_folder_or_specific "$APEX_CLASSES" "$ROOT/classes" ".cls"
          add_folder_or_specific "$APEX_CLASSES" "$ROOT/classes" ".cls-meta.xml"
        fi

        APEX_TRIGGERS="$(members_of ApexTrigger)"
        if [[ -n "$APEX_TRIGGERS" ]]; then
          add_folder_or_specific "$APEX_TRIGGERS" "$ROOT/triggers" ".trigger"
          add_folder_or_specific "$APEX_TRIGGERS" "$ROOT/triggers" ".trigger-meta.xml"
        fi

        VF_PAGES="$(members_of ApexPage)"
        if [[ -n "$VF_PAGES" ]]; then
          add_folder_or_specific "$VF_PAGES" "$ROOT/pages" ".page"
          add_folder_or_specific "$VF_PAGES" "$ROOT/pages" ".page-meta.xml"
        fi

        VF_CMPS="$(members_of ApexComponent)"
        if [[ -n "$VF_CMPS" ]]; then
          add_folder_or_specific "$VF_CMPS" "$ROOT/components" ".component"
          add_folder_or_specific "$VF_CMPS" "$ROOT/components" ".component-meta.xml"
        fi

        LWC_BUNDLES="$(members_of LightningComponentBundle)"
        if [[ -n "$LWC_BUNDLES" ]]; then
          add_folder_or_specific "$LWC_BUNDLES" "$ROOT/lwc"
        fi

        AURA_BUNDLES="$(members_of AuraDefinitionBundle)"
        if [[ -n "$AURA_BUNDLES" ]]; then
          add_folder_or_specific "$AURA_BUNDLES" "$ROOT/aura"
        fi

        sort -u sonar-inclusions.txt -o sonar-inclusions.txt
        if [[ ! -s sonar-inclusions.txt ]]; then
          echo "Aucune inclusion Sonar générée depuis package.xml. Sonar ignoré (succès)."
          exit 0
        fi

        SONAR_INCLUSIONS="$(paste -sd, sonar-inclusions.txt)"
        echo "##vso[task.setvariable variable=SONAR_INCLUSIONS]$SONAR_INCLUSIONS"
      displayName: 'Build Sonar inclusions from package.xml'
      workingDirectory: $(workingDirectory)

    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud analysis (package.xml-only)'
      condition: and(succeeded(), eq(variables['SONAR_AVAILABLE'], 'true'))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
      inputs:
        SonarCloud: 'SF-SonarCloud'
        organization: '$(SONAR_ORG)'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        sonarToken: '$(SONAR_TOKEN)'
        cliSources: '.'
        extraProperties: |
          sonar.inclusions=$(SONAR_INCLUSIONS)
          sonar.scanner.skipJreProvisioning=true
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=**/.git/**,**/node_modules/**,**/bin/**,**/obj/**

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud analysis'
      condition: and(succeeded(), eq(variables['SONAR_AVAILABLE'], 'true'))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'

    - bash: |
        set -euo pipefail

        ORG="$(SONAR_ORG)"
        PROJECT="$(SONAR_PROJECT_KEY)"
        TOKEN="$(SONAR_TOKEN)"

        if [[ -n "${SYSTEM_PULLREQUEST_SOURCEBRANCH:-}" ]]; then
          BRANCH="${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
        else
          BRANCH="${BUILD_SOURCEBRANCHNAME}"
        fi

        sleep 25

        API="https://sonarcloud.io/api/issues/search"

        RESP=$(curl -sS -u "${TOKEN}:" \
          --get "$API" \
          --data-urlencode "organization=$ORG" \
          --data-urlencode "projects=$PROJECT" \
          --data-urlencode "branch=$BRANCH" \
          --data-urlencode "inNewCodePeriod=true" \
          --data-urlencode "resolved=false" \
          --data-urlencode "facets=types,severities" \
          --data-urlencode "ps=1")

        echo ""
        echo "=== NEW CODE - ALERTS PAR TYPE ==="
        echo "$RESP" | jq -r '(.facets[] | select(.property=="types") | .values[] | "\(.val): \(.count)")' || true

        echo ""
        echo "=== NEW CODE - ALERTS PAR SEVERITE ==="
        echo "$RESP" | jq -r '(.facets[] | select(.property=="severities") | .values[] | "\(.val): \(.count)")' || true

        BLOCKING=$(echo "$RESP" | jq '
          (.facets[] | select(.property=="severities") | .values
            | map(select(.val=="BLOCKER" or .val=="CRITICAL") | .count)
            | add) // 0')

        echo ""
        echo "Blocking (BLOCKER+CRITICAL) on New Code: $BLOCKING"

        if [[ "$BLOCKING" -gt 0 ]]; then
          echo ""
          echo "=== BLOCKING ISSUES (NEW CODE) ==="

          DETAIL=$(curl -sS -u "${TOKEN}:" \
            --get "$API" \
            --data-urlencode "organization=$ORG" \
            --data-urlencode "projects=$PROJECT" \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "inNewCodePeriod=true" \
            --data-urlencode "resolved=false" \
            --data-urlencode "severities=BLOCKER,CRITICAL" \
            --data-urlencode "s=SEVERITY" \
            --data-urlencode "ps=100")

          echo "$DETAIL" | jq -r '
            .issues[] |
            "- [\(.severity)] \(.type) | \(.component):\(.line // "?") | \(.message)"
          ' || true

          echo ""
          echo "##vso[task.logissue type=error]Sonar Gate failed: $BLOCKING blocking issue(s) found (BLOCKER/CRITICAL). Deployment stopped."
          exit 42
        fi

        echo "Sonar Gate OK: no BLOCKER/CRITICAL on New Code."
      displayName: 'Gate: stop deploy if BLOCKER/CRITICAL > 0 (print details)'
      condition: and(succeeded(), eq(variables['SONAR_AVAILABLE'], 'true'))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

- stage: UAT
  displayName: 'UAT Stage'
  dependsOn: SONAR
  condition: |
    and(
      succeeded('SONAR'),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/uat'),
        eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/uat')
      )
    )
  jobs:
    - deployment: Deploy_UAT
      displayName: 'Deploy to Salesforce UAT'
      environment: 'UAT Salesforce'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: DownloadSecureFile@1
                name: sfdxJwtKeyUat
                inputs:
                  secureFile: 'SF_UAT_key.pem'

              - task: NodeTool@0
                displayName: 'Install Node.js'
                inputs:
                  versionSpec: '22.19.x'

              - script: |
                  set -euo pipefail
                  echo "=== Node runtime ==="
                  node --version
                  which node
                  npm --version
                  npm uninstall -g @salesforce/cli || true
                  npm install -g @salesforce/cli@latest
                  echo "=== Salesforce CLI ==="
                  which sf
                  sf --version
                  sf plugins --core
                displayName: 'Install Salesforce CLI'

              - script: |
                  sudo apt-get update -y
                  sudo apt-get install -y jq xmlstarlet
                displayName: 'Install jq + xmlstarlet'

              - script: |
                  set -euo pipefail
                  set -x

                  node --version
                  which node
                  which sf
                  sf --version

                  set +x
                  sf org login jwt \
                    --client-id "$(SFDX_CLIENT_ID)" \
                    --jwt-key-file "$(sfdxJwtKeyUat.secureFilePath)" \
                    --username "$(SFDX_USERNAME)" \
                    --instance-url "$SF_ORG_INSTANCE_URL" \
                    --alias uat
                  set -x

                  sf org display --target-org uat
                displayName: 'Authenticate Salesforce (JWT UAT)'
                env:
                  SFDX_CLIENT_ID: $(SFDX_CLIENT_ID)
                  SFDX_USERNAME: $(SFDX_USERNAME)
                  SF_ORG_INSTANCE_URL: $(SF_ORG_INSTANCE_URL)

              - script: |
                  set -euo pipefail
                  set -x

                  MANIFEST_PATH="manifest/package.xml"
                  MDAPI_DIR="mdapi_pkg"
                  MDAPI_FALLBACK_DIR="mdapi_out"

                  [[ -f "$MANIFEST_PATH" ]] || { echo "ERREUR: $MANIFEST_PATH introuvable"; exit 21; }

                  rm -rf "$MDAPI_DIR" "$MDAPI_FALLBACK_DIR"

                  set +e
                  sf project convert source \
                    --manifest "$MANIFEST_PATH" \
                    --output-dir "$MDAPI_DIR" > convert1.out 2> convert1.err
                  CONVERT1_EXIT=$?
                  set -e

                  if [[ $CONVERT1_EXIT -ne 0 || ! -d "$MDAPI_DIR" || -z "$(ls -A "$MDAPI_DIR" 2>/dev/null || true)" ]]; then
                    sf project convert source \
                      --root-dir force-app \
                      --output-dir "$MDAPI_FALLBACK_DIR"
                    echo "USE_DIR=$MDAPI_FALLBACK_DIR" > use_dir.env
                    echo "USE_MANIFEST=--manifest $MANIFEST_PATH" >> use_dir.env
                  else
                    echo "USE_DIR=$MDAPI_DIR" > use_dir.env
                    echo "USE_MANIFEST=" >> use_dir.env
                  fi
                displayName: 'Convert to MDAPI (manifest-first with fallback)'

              - script: |
                  set -euo pipefail
                  set -x
                  source use_dir.env

                  sf deploy metadata \
                    --metadata-dir "$USE_DIR" \
                    ${USE_MANIFEST} \
                    --target-org uat \
                    --test-level NoTestRun \
                    --wait 120 \
                    --json > deploy.json 2> deploy.err || SF_EXIT=$?

                  jq . deploy.json || cat deploy.json
                  cat deploy.err || true

                  JOB_ID=$(jq -r '.result.id // empty' deploy.json || true)
                  if [[ -n "$JOB_ID" ]]; then
                    sf project deploy report --job-id "$JOB_ID" || true
                  fi

                  exit ${SF_EXIT:-0}
                displayName: 'Deploy to UAT (NoTestRun)'

              - script: |
                  set -euo pipefail
                  mkdir -p run-logs
                  for f in deploy.json deploy.err; do
                    if [ -f "$f" ]; then cp -f "$f" run-logs/; fi
                  done
                  if [ -z "$(ls -A run-logs)" ]; then echo "No logs produced." > run-logs/README.txt; fi
                displayName: 'Collect minimal logs'
                condition: always()

              - task: PublishBuildArtifacts@1
                displayName: 'Publish minimal logs'
                condition: always()
                inputs:
                  PathtoPublish: 'run-logs'
                  ArtifactName: 'sf-logs-uat'
                  publishLocation: 'Container'

- stage: PROD_Validate
  displayName: 'PROD Validation (Dry Run)'
  dependsOn: SONAR
  condition: |
    and(
      succeeded('SONAR'),
      or(
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/release')
        ),
        or(
          eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main'),
          eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/release')
        )
      )
    )
  jobs:
    - deployment: Validate_PROD_DryRun
      displayName: 'Validate on Salesforce PROD (checkonly)'
      environment: 'PROD Salesforce'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: DownloadSecureFile@1
                name: sfdxJwtKeyProd
                inputs:
                  secureFile: 'SF_PRD_key.pem'

              - task: NodeTool@0
                displayName: 'Install Node.js'
                inputs:
                  versionSpec: '22.19.x'

              - script: |
                  set -euo pipefail
                  echo "=== Node runtime ==="
                  node --version
                  which node
                  npm --version
                  npm uninstall -g @salesforce/cli || true
                  npm install -g @salesforce/cli@latest
                  echo "=== Salesforce CLI ==="
                  which sf
                  sf --version
                  sf plugins --core
                displayName: 'Install Salesforce CLI'

              - script: |
                  sudo apt-get update -y
                  sudo apt-get install -y jq xmlstarlet
                displayName: 'Install jq + xmlstarlet'

              - script: |
                  set -euo pipefail
                  set -x

                  node --version
                  which node
                  which sf
                  sf --version

                  set +x
                  sf org login jwt \
                    --client-id "$(SFDX_CLIENT_ID_PRD)" \
                    --jwt-key-file "$(sfdxJwtKeyProd.secureFilePath)" \
                    --username "$(SFDX_USERNAME_PRD)" \
                    --instance-url "$SF_ORG_INSTANCE_URL_PRD" \
                    --alias prod
                  set -x

                  sf org display --target-org prod
                displayName: 'Authenticate Salesforce (JWT PROD)'
                env:
                  SFDX_CLIENT_ID_PRD: $(SFDX_CLIENT_ID_PRD)
                  SFDX_USERNAME_PRD: $(SFDX_USERNAME_PRD)
                  SF_ORG_INSTANCE_URL_PRD: $(SF_ORG_INSTANCE_URL_PRD)

              - script: |
                  set -euo pipefail
                  set -x

                  MANIFEST_PATH="manifest/package.xml"
                  MDAPI_DIR="mdapi_pkg"
                  MDAPI_FALLBACK_DIR="mdapi_out"

                  [[ -f "$MANIFEST_PATH" ]] || { echo "ERREUR: $MANIFEST_PATH introuvable"; exit 21; }

                  rm -rf "$MDAPI_DIR" "$MDAPI_FALLBACK_DIR"

                  set +e
                  sf project convert source \
                    --manifest "$MANIFEST_PATH" \
                    --output-dir "$MDAPI_DIR" > convert1.out 2> convert1.err
                  CONVERT1_EXIT=$?
                  set -e

                  if [[ $CONVERT1_EXIT -ne 0 || ! -d "$MDAPI_DIR" || -z "$(ls -A "$MDAPI_DIR" 2>/dev/null || true)" ]]; then
                    sf project convert source \
                      --root-dir force-app \
                      --output-dir "$MDAPI_FALLBACK_DIR"
                    echo "USE_DIR=$MDAPI_FALLBACK_DIR" > use_dir.env
                    echo "USE_MANIFEST=--manifest $MANIFEST_PATH" >> use_dir.env
                  else
                    echo "USE_DIR=$MDAPI_DIR" > use_dir.env
                    echo "USE_MANIFEST=" >> use_dir.env
                  fi
                displayName: 'Convert to MDAPI (manifest-first with fallback)'

              - script: |
                  set -euo pipefail
                  set -x
                  source use_dir.env
                  MANIFEST_PATH="manifest/package.xml"

                  sf project deploy validate \
                    --metadata-dir "$USE_DIR" \
                    ${USE_MANIFEST} \
                    --target-org prod \
                    --test-level "$(TEST_LEVEL_PROD)" \
                    --wait 180 \
                    --json > deploy_prod_validate.json 2> deploy_prod_validate.err || SF_EXIT=$?

                  jq . deploy_prod_validate.json || cat deploy_prod_validate.json
                  cat deploy_prod_validate.err || true

                  JOB_ID=$(jq -r '.result.id // .result.deployId // empty' deploy_prod_validate.json || true)
                  STATUS=$(jq -r '.result.status // empty' deploy_prod_validate.json || true)

                  mkdir -p run-logs
                  echo "$JOB_ID" > run-logs/prod-validation-job-id.txt

                  PACKAGE_ELEMENTS_FILE="run-logs/prod-package-elements.md"
                  python3 - "$MANIFEST_PATH" "$PACKAGE_ELEMENTS_FILE" <<'PY'
                  import sys
                  import xml.etree.ElementTree as ET

                  manifest_path, output_path = sys.argv[1], sys.argv[2]

                  def local_name(tag):
                      return tag.split('}', 1)[-1]

                  root = ET.parse(manifest_path).getroot()
                  items = []

                  for type_node in root:
                      if local_name(type_node.tag) != 'types':
                          continue

                      metadata_type = ''
                      members = []

                      for child in type_node:
                          child_name = local_name(child.tag)
                          child_text = (child.text or '').strip()

                          if child_name == 'name':
                              metadata_type = child_text
                          elif child_name == 'members':
                              members.append(child_text)

                      for member in members:
                          if metadata_type and member:
                              items.append((metadata_type, member))

                  with open(output_path, 'w', encoding='utf-8') as output:
                      output.write('## Elements du package valides\n\n')

                      if not items:
                          output.write('_Aucun element trouve dans manifest/package.xml._\n')
                      else:
                          current_type = None
                          for metadata_type, member in sorted(items):
                              if metadata_type != current_type:
                                  output.write(f'\n### {metadata_type}\n')
                                  current_type = metadata_type
                              output.write(f'- `{member}`\n')
                  PY

                  {
                    echo "# PROD validation Salesforce"
                    echo ""
                    echo "- Validation job id: \`$JOB_ID\`"
                    echo "- Status: \`$STATUS\`"
                    echo "- Branch: \`$(Build.SourceBranch)\`"
                    echo "- Commit: \`$(Build.SourceVersion)\`"
                    echo ""
                    echo "Le quick deploy PROD utilisera automatiquement cet ID apres approbation manuelle."
                    echo ""
                    cat "$PACKAGE_ELEMENTS_FILE"
                  } > run-logs/prod-validation-summary.md

                  echo "##vso[task.setvariable variable=PROD_VALIDATION_JOB_ID;isOutput=true]$JOB_ID"
                  test -f "$(System.DefaultWorkingDirectory)/run-logs/prod-validation-summary.md"
                  set +x
                  echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/run-logs/prod-validation-summary.md"
                  set -x
                  echo "Validation PROD job id: $JOB_ID"

                  if [[ -n "$JOB_ID" ]]; then
                    sf project deploy report --job-id "$JOB_ID" --target-org prod || true
                  fi

                  echo "=== Package valide PROD ==="
                  cat "$PACKAGE_ELEMENTS_FILE"

                  exit ${SF_EXIT:-0}
                name: SaveProdValidationId
                displayName: 'Validate on PROD and save validation id'

              - script: |
                  set -euo pipefail
                  mkdir -p run-logs
                  for f in deploy_prod_validate.json deploy_prod_validate.err use_dir.env convert1.out convert1.err; do
                    if [ -f "$f" ]; then cp -f "$f" run-logs/; fi
                  done
                  if [ -z "$(ls -A run-logs)" ]; then echo "No logs produced." > run-logs/README.txt; fi
                displayName: 'Collect PROD validation logs'
                condition: always()

              - task: PublishPipelineArtifact@1
                displayName: 'Publish PROD validation artifact'
                condition: always()
                inputs:
                  targetPath: 'run-logs'
                  artifact: 'sf-prod-validation'
                  publishLocation: 'pipeline'


- stage: PROD_Quick_Deploy_Manual
  displayName: 'PROD Quick Deploy Manual'
  dependsOn: PROD_Validate

  # Autorise le quick deploy uniquement apres une validation PROD reussie.
  condition: |
    and(
      succeeded('PROD_Validate'),
      ne(variables['Build.Reason'], 'Schedule'),
      ne(variables['Build.Reason'], 'PullRequest'),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/release')
      )
    )
  jobs:
    - deployment: Deploy_PROD_Quick
      displayName: 'Deploy to Salesforce PROD with validated id'

      # Cet environnement porte l'approbation manuelle du deploiement PROD.
      environment: 'PROD Salesforce Deploy'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: DownloadPipelineArtifact@2
                displayName: 'Download PROD validation artifact'
                inputs:
                  # Recupere l'artifact cree par la validation du meme run.
                  buildType: 'current'
                  artifactName: 'sf-prod-validation'
                  targetPath: '$(Pipeline.Workspace)/sf-prod-validation'

              - task: DownloadSecureFile@1
                name: sfdxJwtKeyProdDeploy
                inputs:
                  secureFile: 'SF_PRD_key.pem'

              - task: NodeTool@0
                displayName: 'Install Node.js'
                inputs:
                  versionSpec: '22.19.x'

              - script: |
                  set -euo pipefail
                  echo "=== Node runtime ==="
                  node --version
                  which node
                  npm --version
                  npm uninstall -g @salesforce/cli || true
                  npm install -g @salesforce/cli@latest
                  echo "=== Salesforce CLI ==="
                  which sf
                  sf --version
                  sf plugins --core
                displayName: 'Install Salesforce CLI'

              - script: |
                  set -euo pipefail
                  sudo apt-get update -y
                  sudo apt-get install -y jq
                displayName: 'Install jq'

              - script: |
                  set -euo pipefail
                  set -x

                  set +x
                  sf org login jwt \
                    --client-id "$(SFDX_CLIENT_ID_PRD)" \
                    --jwt-key-file "$(sfdxJwtKeyProdDeploy.secureFilePath)" \
                    --username "$(SFDX_USERNAME_PRD)" \
                    --instance-url "$SF_ORG_INSTANCE_URL_PRD" \
                    --alias prod
                  set -x

                  sf org display --target-org prod
                displayName: 'Authenticate Salesforce (JWT PROD deploy)'
                env:
                  SFDX_CLIENT_ID_PRD: $(SFDX_CLIENT_ID_PRD)
                  SFDX_USERNAME_PRD: $(SFDX_USERNAME_PRD)
                  SF_ORG_INSTANCE_URL_PRD: $(SF_ORG_INSTANCE_URL_PRD)

              - script: |
                  set -euo pipefail
                  set -x

                  VALIDATION_ID_FILE="$(Pipeline.Workspace)/sf-prod-validation/prod-validation-job-id.txt"

                  # Recupere automatiquement l'ID cree pendant la validation PROD.
                  [[ -f "$VALIDATION_ID_FILE" ]] || { echo "ERREUR: ID de validation introuvable dans l'artifact"; exit 33; }

                  VALIDATION_JOB_ID=$(tr -d '[:space:]' < "$VALIDATION_ID_FILE")
                  [[ -n "$VALIDATION_JOB_ID" ]] || { echo "ERREUR: ID de validation vide dans l'artifact"; exit 34; }

                  echo "Quick deploy avec validation id: $VALIDATION_JOB_ID"

                  sf project deploy report \
                    --job-id "$VALIDATION_JOB_ID" \
                    --target-org prod || true

                  sf project deploy quick \
                    --job-id "$VALIDATION_JOB_ID" \
                    --target-org prod \
                    --wait 180 \
                    --json > deploy_prod_quick.json 2> deploy_prod_quick.err || SF_EXIT=$?

                  jq . deploy_prod_quick.json || cat deploy_prod_quick.json
                  cat deploy_prod_quick.err || true

                  QUICK_DEPLOY_ID=$(jq -r '.result.id // .result.deployId // empty' deploy_prod_quick.json || true)
                  QUICK_STATUS=$(jq -r '.result.status // empty' deploy_prod_quick.json || true)

                  mkdir -p run-logs
                  echo "$VALIDATION_JOB_ID" > run-logs/prod-validation-job-id.txt
                  echo "$QUICK_DEPLOY_ID" > run-logs/prod-quick-deploy-job-id.txt

                  VALIDATED_PACKAGE_ELEMENTS_FILE="$(Pipeline.Workspace)/sf-prod-validation/prod-package-elements.md"
                  DEPLOYED_PACKAGE_ELEMENTS_FILE="run-logs/prod-package-elements-deployed.md"

                  if [[ -f "$VALIDATED_PACKAGE_ELEMENTS_FILE" ]]; then
                    sed 's/^## Elements du package valides$/## Elements du package deployes/' "$VALIDATED_PACKAGE_ELEMENTS_FILE" > "$DEPLOYED_PACKAGE_ELEMENTS_FILE"
                  else
                    {
                      echo "## Elements du package deployes"
                      echo ""
                      echo "_Liste indisponible dans l'artifact de validation._"
                    } > "$DEPLOYED_PACKAGE_ELEMENTS_FILE"
                  fi

                  {
                    echo "# PROD quick deploy Salesforce"
                    echo ""
                    echo "- Validation build id: \`$(Build.BuildId)\`"
                    echo "- Validation job id utilise: \`$VALIDATION_JOB_ID\`"
                    echo "- Quick deploy job id: \`$QUICK_DEPLOY_ID\`"
                    echo "- Status: \`$QUICK_STATUS\`"
                    echo "- Branch: \`$(Build.SourceBranch)\`"
                    echo "- Commit: \`$(Build.SourceVersion)\`"
                    echo ""
                    cat "$DEPLOYED_PACKAGE_ELEMENTS_FILE"
                  } > run-logs/prod-quick-deploy-summary.md

                  test -f "$(System.DefaultWorkingDirectory)/run-logs/prod-quick-deploy-summary.md"
                  set +x
                  echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/run-logs/prod-quick-deploy-summary.md"
                  set -x
                  echo "=== Package deploye PROD ==="
                  cat "$DEPLOYED_PACKAGE_ELEMENTS_FILE"

                  exit ${SF_EXIT:-0}
                displayName: 'Quick deploy PROD from validation id'

              - script: |
                  set -euo pipefail
                  mkdir -p run-logs
                  for f in deploy_prod_quick.json deploy_prod_quick.err; do
                    if [ -f "$f" ]; then cp -f "$f" run-logs/; fi
                  done
                  if [ -z "$(ls -A run-logs)" ]; then echo "No logs produced." > run-logs/README.txt; fi
                displayName: 'Collect PROD deploy logs'
                condition: always()

              - task: PublishPipelineArtifact@1
                displayName: 'Publish PROD deploy artifact'
                condition: always()
                inputs:
                  targetPath: 'run-logs'
                  artifact: 'sf-prod-deploy'
                  publishLocation: 'pipeline'

- stage: UAT_Validate_Nightly
  displayName: 'UAT Nightly Validation (Run Tests)'
  dependsOn: SONAR
  condition: |
    and(
      succeeded('SONAR'),
      eq(variables['Build.Reason'], 'Schedule'),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/uat'),
        eq(variables['Build.SourceBranch'], 'refs/heads/release')
      )
    )
  variables:
    TEST_LEVEL_UAT_NIGHTLY: 'RunAllTestsInOrg'
  jobs:
    - deployment: Validate_UAT_DryRun
      displayName: 'Validate on Salesforce UAT (no deploy, run tests)'
      environment: 'UAT Salesforce'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: DownloadSecureFile@1
                name: sfdxJwtKeyUatNightly
                inputs:
                  secureFile: 'SF_UAT_key.pem'

              - task: NodeTool@0
                displayName: 'Install Node.js'
                inputs:
                  versionSpec: '22.19.x'

              - script: |
                  set -euo pipefail
                  echo "=== Node runtime ==="
                  node --version
                  which node
                  npm --version
                  npm uninstall -g @salesforce/cli || true
                  npm install -g @salesforce/cli@latest
                  echo "=== Salesforce CLI ==="
                  which sf
                  sf --version
                  sf plugins --core
                displayName: 'Install Salesforce CLI'

              - script: |
                  sudo apt-get update -y
                  sudo apt-get install -y jq xmlstarlet
                displayName: 'Install jq + xmlstarlet'

              - script: |
                  set -euo pipefail
                  set -x

                  node --version
                  which node
                  which sf
                  sf --version

                  set +x
                  sf org login jwt \
                    --client-id "$(SFDX_CLIENT_ID)" \
                    --jwt-key-file "$(sfdxJwtKeyUatNightly.secureFilePath)" \
                    --username "$(SFDX_USERNAME)" \
                    --instance-url "$SF_ORG_INSTANCE_URL" \
                    --alias uat
                  set -x

                  sf org display --target-org uat
                displayName: 'Authenticate Salesforce (JWT UAT)'
                env:
                  SFDX_CLIENT_ID: $(SFDX_CLIENT_ID)
                  SFDX_USERNAME: $(SFDX_USERNAME)
                  SF_ORG_INSTANCE_URL: $(SF_ORG_INSTANCE_URL)

              - script: |
                  set -euo pipefail
                  set -x

                  MANIFEST_PATH="manifest/package.xml"
                  MDAPI_DIR="mdapi_pkg"
                  MDAPI_FALLBACK_DIR="mdapi_out"

                  [[ -f "$MANIFEST_PATH" ]] || { echo "ERREUR: $MANIFEST_PATH introuvable"; exit 21; }

                  rm -rf "$MDAPI_DIR" "$MDAPI_FALLBACK_DIR"

                  set +e
                  sf project convert source \
                    --manifest "$MANIFEST_PATH" \
                    --output-dir "$MDAPI_DIR" > convert1.out 2> convert1.err
                  CONVERT1_EXIT=$?
                  set -e

                  if [[ $CONVERT1_EXIT -ne 0 || ! -d "$MDAPI_DIR" || -z "$(ls -A "$MDAPI_DIR" 2>/dev/null || true)" ]]; then
                    sf project convert source \
                      --root-dir force-app \
                      --output-dir "$MDAPI_FALLBACK_DIR"
                    echo "USE_DIR=$MDAPI_FALLBACK_DIR" > use_dir.env
                    echo "USE_MANIFEST=--manifest $MANIFEST_PATH" >> use_dir.env
                  else
                    echo "USE_DIR=$MDAPI_DIR" > use_dir.env
                    echo "USE_MANIFEST=" >> use_dir.env
                  fi
                displayName: 'Convert to MDAPI (manifest-first with fallback)'

              - script: |
                  set -euo pipefail
                  set -x
                  source use_dir.env

                  sf project deploy validate \
                    ${USE_MANIFEST} \
                    --metadata-dir "$USE_DIR" \
                    --target-org uat \
                    --test-level "$(TEST_LEVEL_UAT_NIGHTLY)" \
                    --wait 180 \
                    --json > deploy_uat_nightly_validate.json 2> deploy_uat_nightly_validate.err || SF_EXIT=$?

                  jq . deploy_uat_nightly_validate.json || cat deploy_uat_nightly_validate.json
                  cat deploy_uat_nightly_validate.err || true

                  JOB_ID=$(jq -r '.result.id // empty' deploy_uat_nightly_validate.json || true)
                  if [[ -n "$JOB_ID" ]]; then
                    sf project deploy report --job-id "$JOB_ID" || true
                  fi

                  exit ${SF_EXIT:-0}
                displayName: 'Validate on UAT (tests executed)'

              - script: |
                  set -euo pipefail
                  mkdir -p run-logs
                  for f in deploy_uat_nightly_validate.json deploy_uat_nightly_validate.err; do
                    if [ -f "$f" ]; then cp -f "$f" run-logs/; fi
                  done
                  if [ -z "$(ls -A run-logs)" ]; then echo "No logs produced." > run-logs/README.txt; fi
                displayName: 'Collect minimal logs (UAT nightly)'
                condition: always()

              - task: PublishBuildArtifacts@1
                displayName: 'Publish minimal logs (UAT nightly)'
                condition: always()
                inputs:
                  PathtoPublish: 'run-logs'
                  ArtifactName: 'sf-logs-uat-nightly'
                  publishLocation: 'Container'